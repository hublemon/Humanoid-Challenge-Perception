pipe_detector:
  ros__parameters:
    part_name: pipe
    head_topic: "" #/zed/zed_node/rgb/image_rect_color
    wrist_left_topic: "" #/camera_left/camera_left/color/image_rect_raw
    wrist_right_topic: /camera_right/camera_right/color/image_rect_raw
    detections_topic: /detections/scenario_c/pipe
    mode: match
    parent_class: pipe
    child_class: pipe_opening
    child_direct_confidence_threshold: 0.8
    index_by_x: true
    fit_ellipse: true
    conf_threshold: 0.3
    iou_threshold: 0.35
    imgsz: 640
    publish_debug_image: true
    smoothing_window_sec: 0.3
    smoothing_min_ratio: 0.5
    smoothing_match_dist: 40.0
    log_detections: false
